# Production Compose for EC2 — pulls pre-built images from Docker Hub.
# Set DOCKERHUB_USERNAME and IMAGE_TAG in .env on the server (or export before deploy).

services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-incidentdb}
      POSTGRES_USER: ${POSTGRES_USER:-incident_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-incident_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-incident_user} -d ${POSTGRES_DB:-incidentdb}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - incident-network

  backend:
    image: ${DOCKERHUB_USERNAME}/incident-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-incidentdb}
      DB_USER: ${POSTGRES_USER:-incident_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-incident_password}
      NODE_ENV: production
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      - database
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - incident-network

  frontend:
    image: ${DOCKERHUB_USERNAME}/incident-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - incident-network

volumes:
  postgres_data:

networks:
  incident-network:
    driver: bridge
