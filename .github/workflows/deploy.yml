name: CI/CD Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose config
        run: docker compose -f compose.yaml config

      - name: Build images
        run: docker compose -f compose.yaml build

  push:
    name: Push to Docker Hub
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/incident-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/incident-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/incident-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/incident-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    needs: push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: compose.prod.yaml
          target: ${{ secrets.EC2_APP_PATH }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.EC2_APP_PATH }}"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            if [ ! -f compose.prod.yaml ]; then
              echo "ERROR: compose.prod.yaml not found in $APP_DIR"
              ls -la "$APP_DIR"
              exit 1
            fi

            if [ ! -f .env ]; then
              echo "ERROR: .env not found in $APP_DIR"
              echo "Create it once on EC2 with POSTGRES_*, BACKEND_PORT, FRONTEND_PORT, DOCKERHUB_USERNAME"
              exit 1
            fi

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
            export IMAGE_TAG="${{ github.sha }}"

            docker compose -f compose.prod.yaml pull
            docker compose -f compose.prod.yaml up -d --remove-orphans

            echo "Waiting for application to respond..."
            DEPLOY_OK=false
            for attempt in $(seq 1 24); do
              if docker compose -f compose.prod.yaml exec -T backend wget -qO- http://127.0.0.1:5000/health 2>/dev/null | grep -q '"status":"healthy"'; then
                if docker compose -f compose.prod.yaml exec -T frontend curl -sf http://127.0.0.1/ >/dev/null 2>&1; then
                  DEPLOY_OK=true
                  echo "Deploy verified on attempt $attempt"
                  break
                fi
              fi
              echo "Attempt $attempt/24 — services not ready yet, waiting 5s..."
              sleep 5
            done

            docker compose -f compose.prod.yaml ps -a

            if [ "$DEPLOY_OK" != "true" ]; then
              echo "=== Deploy verification failed ==="
              for id in $(docker compose -f compose.prod.yaml ps -q); do
                name=$(docker inspect --format='{{.Name}}' "$id" | sed 's/^\///')
                state=$(docker inspect --format='{{.State.Status}}' "$id")
                health=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}n/a{{end}}' "$id")
                echo "$name -> state=$state health=$health"
              done
              docker compose -f compose.prod.yaml logs --no-color --tail=100 database
              docker compose -f compose.prod.yaml logs --no-color --tail=100 backend
              docker compose -f compose.prod.yaml logs --no-color --tail=100 frontend
              exit 1
            fi

            docker image prune -f

            docker compose -f compose.prod.yaml ps
